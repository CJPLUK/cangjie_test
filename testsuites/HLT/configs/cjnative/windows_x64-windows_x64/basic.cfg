[description]
	title = x86_64-w64-mingw32->x86_64-w64-mingw32
[root]
	path = ../../../
[suffix]
	cj = //
	info = //
[env]
	LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
[condition]
	condition =
		native_compilation
		Windows
		host_win
		x86
		host_x86_64
		target_win
		target_x86_64
		x86
		Windows
		CJNATIVE
[internal-var]
	cangjie_test = %%CANGJIE_TEST%%
	compiler = cjc
	compiler_frontend = cjc-frontend
	cmp_opt = --error-count-limit=all --diagnostic-format=json %%ohos_opt --dy-std
	local = --experimental --enable-local-mode
	cmp_opt_frontend = --error-count-limit=all --diagnostic-format=json %%ohos_opt_pc
	output = %%n.%%suffix
	suffix = exe
	test_suffix = %%dylib_suffix
	middle = a
	null_path = NUL
	serial_compile = 
	close_apc_compile = --apc=1
	hle_c = %%CANGJIE_HOME%%/tools/bin/hle -c -b %%CANGJIE_HOME%%/tools/dtsparser/node_modules/.bin/cjbind.exe
	hle_arkts = %%CANGJIE_HOME%%/tools/bin/hle -r %%CANGJIE_HOME%%/tools/dtsparser/node_modules/typescript -j %%CANGJIE_HOME%%/tools/dtsparser/analysis.js
	cjcompat = %%CANGJIE_HOME%%/tools/bin/cjcompat
	old_cjo = --old
	new_cjo = --new
	cjfmt = %%CANGJIE_HOME%%/tools/bin/cjfmt
	lint = %%CANGJIE_HOME%%/tools/bin/cjlint
	cangjieDir = %%CANGJIE_HOME%%
	cangjie-home = %%CANGJIE_HOME%%
	cangjieStdxPath = %%CANGJIE_STDX_PATH%%
	cjcov = %%CANGJIE_HOME%%/tools/bin/cjcov
	cjtrace_recover = %%CANGJIE_HOME%%/tools/bin/cjtrace-recover
	export = set
	source = sh
	run = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% && 
	run_pkg = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% && 
	run_macro = set LD_LIBRARY_PATH=%%chdir%%:%%LD_LIBRARY_PATH%% && 
	run_stdx = set PATH=%%CANGJIE_STDX_PATH%%;%%CANGJIE_STDX_PATH%%/../../dynamic/stdx;%%PATH%% && 
	run_opt = 
	release_dir = target/release
	cangjie-stdx-list = -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors -lstdx -lstdx.syntax -lstdx.syntaxFFI
	run_args = 
	run_args_arg = 
	static_std = --static-std
	dy_std = --dy-std
	static_libs = --static-libs
	dy_libs = --dy-libs
	ldd = ldd
	main = main
	mod_opt = --module
	mod_name = --module-name module_name
	pkg_opt = --package
	compile_lib_opt = --output-type=staticlib
	extra_options = 
	compile_dylib_opt = --output-type=dylib
	compile_chir_opt = --output-type=chir --experimental
	compile_dylib_opt_cjmp = --common-part-chir=mp.chir --common-part-cjo=mp.cjo --output-type=dylib --experimental
	compile_lib_opt_cjmp = --common-part-chir=mp.chir --common-part-cjo=mp.cjo --output-type=staticlib --experimental
	link_cjmp = -L . -lmp
	cmp_stable_abi_dylib = -L. -lstable_abi
	enableConstPropagation = --fchir-constant-propagation
	syntax_extra_options = -lc++ -lunwind
	incremental_compile = --incremental-compile --experimental
	overflow_wrapping = --int-overflow=wrapping
	conditional_compilation_config_opt = --cfg
	link-core = -lcangjie-std-core
	link_collection = 
	link-eh = -lstdx.effect --experimental --enable-eh
	stdx-package = -L %%CANGJIE_HOME%%/runtime/lib/windows_x86_64_cjnative
	cangjie-stdx-package = %%CANGJIE_STDX_PATH%%
	stdx-library-path = -L %%CANGJIE_STDX_PATH%% --import-path %%CANGJIE_STDX_PATH%%
	import-cangjie-stdx = -L %%CANGJIE_STDX_PATH%% -lstdx.chir -lstdx.unittest.data -lstdx.unittest -lstdx.encoding.json -lstdx.serialization.serialization -lstdx.serialization -lstdx.net.http -lstdx.net.tls -lstdx.net.tls.common -lstdx.net -lstdx.logger -lstdx.log -lstdx.encoding.url -lstdx.encoding.json.stream -lstdx.crypto.kit -lstdx.crypto.x509 -lstdx.crypto.crypto -lstdx.crypto.keys -lstdx.crypto.digest -lstdx.crypto.common -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding -lstdx.compress.tar -lstdx.crypto -lstdx.compress.zlib -lstdx.compress -lstdx.actors -lstdx -lstdx.syntax -lstdx.syntaxFFI --import-path %%CANGJIE_STDX_PATH%%
	cffi_output = lib%%n.%%cffi_suffix
	ffic_opt = -L . -l %%n %%n.cj
	pkg_compile = --output-type=dylib -L . -l c_ffi
	pkg_link = -L . -l c_ffi -l pkg
	cffi_runtime_opt = 
	cffi_runtime_link = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/windows_x86_64_cjnative/ -lcangjie-runtime -Wl,-whole-archive -Wl,-no-whole-archive -lstdc++ -fno-omit-frame-pointer
	cffi_runtime_link_no_elfloader = -D__DSU__ -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/windows_x86_64_cjnative/ -lcangjie-runtime  -Wl,-whole-archive  -Wl,-no-whole-archive -lstdc++ -fno-omit-frame-pointer
	clang_link_core = -framework Foundation
	clang_link_objc_interop = -lobjc -lobjc.internal -I.
	optimization_options = 
	debug_options = 
	lto_options = 
	sanitizer_options = 
	cffi_runtime_ld = --output-type=dylib -L . -l ffi%%n
	cffi_std_link = -lstdc++
	sanitizer_hwasan = --sanitize=hwaddress
	boundscheck = -I%%CANGJIE_HOME%%/include -L %%CANGJIE_HOME%%/runtime/lib/windows_x86_64_cjnative/ -lboundscheck
	cffi_suffix = %%dylib_suffix
	mock_options = 
	set = set
	plugin_lsp_suffix = dll.a
	chir-dis = chir-dis
	link_openssl = 
	clang = clang
	gcc = gcc
	openssl_path = %%OPENSSL_PATH%%
	c_compiler = clang
	clang_opt = -shared --target=x86_64-w64-mingw32
	ls = dir
	host_ls = dir
	host_cp = copy
	target_ls = dir
	target_cp = copy
	libdir = %%CANGJIE_HOME%%/modules/windows_x86_64_cjnative/
	cat = type
	target_cat = type
	target_shell = bash
	mv = move
	rm = del
	cp = copy
	touch = touch
	diff = diff
	grep = findstr
	sed = sed
	sed_opt = -i
	chmod = chmod
	pwd = %%cd%%
	mkdir = md
	rmdir = rd /s /q
	use_ast = 
	use_pic_ast = 
	pic_opt = 
	macro_lib_opt = 
	append_opt = 
	append_pic_opt = 
	append_macro_lib_opt = 
	macro_debug = --debug-macro
	enable_macro = 
	cmp_macro = --error-count-limit=all --diagnostic-format=json --compile-macro
	macro_lib = 
	macro_opt = --output-type=dylib
	run_macro_opt = 
	cjpm_opt = --target=x86_64-w64-mingw32
	cjpm = cjpm
	cpm_bin_path = ./build/bin
	python = python3
	dump = -frontend --dump-parse
	closebuf = stdbuf -o0 -e0
	export_expand = export PATH=$(pwd):$PATH
	object_file_suffix = obj
	git_dir_prefix = set GIT_DIR=
	git_dir_suffix = &&
	obf_string = --fobf-string
	no_obf_string = --fno-obf-string
	obf_const = --fobf-const
	no_obf_const = --fno-obf-const
	obf_layout = --fobf-layout
	ndk_root = %%NDK_ROOT%%
	no_obf_layout = --fno-obf-layout
	obf_cf_flatten = --fobf-cf-flatten
	no_obf_cf_flatten = --fno-obf-cf-flatten
	obf_cf_bogus = --fobf-cf-bogus
	no_obf_cf_bogus = --fno-obf-cf-bogus
	obf_export = --fobf-export-symbols
	prebuilt-toolchain = 
	no_obf_export = --fno-obf-export-symbols
	obf_sym_input = --obf-sym-input-mapping
	obf_sym_output = --obf-sym-output-mapping
	obf_apply_mapping = --obf-apply-mapping-file
	obf_sym_prefix = --obf-sym-prefix
	obf_source_path = --fobf-source-path
	no_obf_source_path = --fno-obf-source-path
	obf_line_number = --fobf-line-number
	no_obf_line_number = --fno-obf-line-number
	obf_all = --fobf-all
	save_temps = --save-temps=.
	disassembler = set LD_LIBRARY_PATH=%%CANGJIE_HOME%%/third_party/llvm/lib:%%LD_LIBRARY_PATH%% && %%CANGJIE_HOME%%/third_party/llvm/bin/llvm-dis
	cmp_output = 
	compilation_options = --error-count-limit=all --diagnostic-format=json %%ohos_opt
	linkage_options = --dy-std
	dylib_suffix = dll
	cmp_utest_opt = --test
	shell = $SHELL
	run_utest_opt = %%utest_no_progress
	utest_no_progress = --no-progress
	java = java
	compile_executable = --output-type=exe
	javac = javac -encoding UTF-8
	java_mirror_gen = -Dpackage.mode=true -jar %%CANGJIE_HOME%%/tools/bin/java-mirror-gen.jar -d . -cp .
	java_interop_template = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/MyApplication
	java_interop_util = %%CANGJIE_TEST%%/testsuites/HLT/compiler/cjnative/FFI/jffi/android/util
	java_interop_runner = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/run.py
	java_interop_setup = %%CANGJIE_TEST%%/testsuites/HLT/configs/cjnative/android/setup.py
	cp_loader_jar = -cp .:%%CANGJIE_HOME%%/lib/library-loader.jar
	jffi_link = -L . -ljava.lang -ljava.internal
	cangjie-repo-token = %%CANGJIE_REPO_TOKEN%%
	repo_sed = sed -i
	host_dylib_suffix = dll
	cangjie-stdx-path = %%CANGJIE_STDX_PATH%%/../..
	cangjie-static-stdx-path = %%CANGJIE_STDX_PATH%%/../../static/stdx
	cangjie-dynamic-stdx-path = %%CANGJIE_STDX_PATH%%/../../dynamic/stdx
	host-cangjie-dynamic-stdx-path = %%CANGJIE_STDX_PATH%%/../../dynamic/stdx
	cangjie_static_extern_stdx_path = %%CANGJIE_STDX_PATH%%/../../static-static-link-extern/stdx
	check-dylib-dep = %%CANGJIE_HOME%%/third_party/llvm/bin/llvm-objdump -p
	cangjie_runtime_link = 
	link_oc = -lobjc.internal -lobjc.lang --link-options "-framework Foundation"
	host = windows_x86_64_cjnative
	target = windows_x86_64_cjnative
	java_home = %%JAVA_HOME%%
	ohos_opt = 
	ohos_opt_pc = --target=x86_64-w64-mingw32
	clang_opt_objc = -fmodules -fobjc-arc -I%%CANGJIE_HOME%%/include -L%%CANGJIE_HOME%%/runtime/lib/darwin_aarch64_cjnative -lcangjie-runtime
	cmp_ocffi_opt = --error-count-limit 3 -Woff all --objc-interop-output-dir objc-gen
	mirror_gen = ObjCInteropGen --mode=normal
	ins_nm_cjworld = --link-options="-install_name @rpath/libcjworld.dylib"
	mirror_opt = --generate-definitions
	enable_objc_cjmapping = --experimental --enable-interop-cjmapping=ObjC
	run_env = windows_x86_64_cjnative
	interop_config = --experimental --import-interop-cj-package-config-path
	compile_library = --output-type=staticlib
	library_suffix = dll
	host_library_suffix = dll
	host_triple = x86_64-w64-mingw32
	target_triple = x86_64-w64-mingw32
