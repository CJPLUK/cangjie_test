[package]
  cjc-version = "1.2.0"
  name = "pkg_lib_0"
  organization = ""
  description = "description with emoji 😀 and 🎯 symbols"
  version = "7.3.6"
  target-dir = "custom_target"
  script-dir = "artifacts"
  output-type = "static"
  compile-option = "-Woff=all"
